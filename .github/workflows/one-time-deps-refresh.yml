name: One-time npm lockfile remediation

on:
  push:
    branches: [security/migradry-deps-20261113]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Update only allowed lockfile versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Some advisory fixes require manual review"
          git diff --exit-code -- package.json
          npm audit --audit-level=high
      - name: Build and test remediated dependency tree
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit tested lockfile onto this branch
        run: |
          git config user.name 'SC7Labs dependency maintenance'
          git config user.email 'build@sc7.invalid'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh audited npm dependency lock"
            git push origin HEAD:security/migradry-deps-20261113
          else
            echo 'No lockfile changes needed'
          fi
